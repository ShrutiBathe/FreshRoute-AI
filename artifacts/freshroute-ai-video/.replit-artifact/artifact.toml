kind = "video"
videoAspectRatio = "16:9"
previewPath = "/freshroute-ai-video/"
title = "FreshRoute AI Explainer"
description = "A short animated explainer showing how FreshRoute AI turns changing accessibility observations into confidence-aware route recommendations."
version = "1.0.0"
id = "artifacts/freshroute-ai-video"
router = "path"

[[services]]
name = "web"
paths = [ "/freshroute-ai-video/" ]
localPort = 18425

[services.development]
run = "pnpm --filter @workspace/freshroute-ai-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/freshroute-ai-video", "run", "build" ]
serve = "static"
publicDir = "artifacts/freshroute-ai-video/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18425"
BASE_PATH = "/freshroute-ai-video/"
